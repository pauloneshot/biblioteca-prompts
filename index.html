<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaulOneShot - Biblioteca de Prompts</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --accent-color: #ffe600;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }
        header { padding: 60px 20px 40px; text-align: center; width: 100%; max-width: 800px; }
        header img { max-width: 250px; height: auto; margin-bottom: 15px; }
        header p { color: var(--text-muted); font-size: 1.1rem; margin: 0; }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px; padding: 20px; width: 100%; max-width: 1200px;
            box-sizing: border-box; margin-bottom: 60px;
        }
        .card {
            position: relative; border-radius: 16px; overflow: hidden;
            cursor: pointer; background-color: var(--surface-color);
            aspect-ratio: 1 / 1; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Estilo si la imagen falla al cargar */
        .img-error {
            padding: 20px; text-align: center; color: #ff5555; font-size: 0.9rem;
        }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75); display: flex; flex-direction: column;
            justify-content: center; align-items: center; opacity: 0;
            transition: opacity 0.3s ease; padding: 20px; text-align: center;
        }
        .card:hover .overlay { opacity: 1; }
        .overlay-icon { font-size: 2rem; margin-bottom: 10px; }
        .overlay-text { color: var(--accent-color); font-weight: 600; font-size: 1.1rem; }
        
        #toast {
            visibility: hidden; min-width: 260px; background-color: var(--accent-color);
            color: #000; text-align: center; border-radius: 30px; padding: 14px 24px;
            position: fixed; z-index: 100; bottom: 40px; left: 50%;
            transform: translateX(-50%); font-weight: 700; opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            box-shadow: 0px 10px 30px rgba(255, 230, 0, 0.3);
        }
        #toast.show { visibility: visible; bottom: 50px; opacity: 1; }
    </style>
</head>
<body>
    <header>
        <img src="pauloneshot-solo-nombre.png" alt="PaulOneShot Logo" onerror="this.style.display='none'">
        <p>Haz clic en cualquier tarjeta para copiar su prompt al instante.</p>
    </header>

    <main class="gallery" id="gallery-container">
        <!-- Cargando prompts... -->
    </main>

    <div id="toast">¡Prompt copiado con éxito!</div>

    <script>
        async function loadPrompts() {
            try {
                const response = await fetch('prompts.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error("No se pudo cargar prompts.json");
                
                const prompts = await response.json();
                const container = document.getElementById('gallery-container');
                container.innerHTML = '';

                if (prompts.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">No hay prompts guardados todavía.</p>';
                    return;
                }

                prompts.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    // Evento de clic limpio y directo para copiar el texto
                    card.onclick = function() {
                        copyToClipboard(item.prompt);
                    };
                    
                    card.innerHTML = `
                        <img src="${item.image}" alt="Prompt Image" onerror="this.outerHTML='<div class=\\'img-error\\'>⚠️ No se pudo cargar la imagen.<br><small>Revisa que el enlace sea directo.</small></div>'">
                        <div class="overlay">
                            <span class="overlay-icon">📋</span>
                            <span class="overlay-text">Copiar Prompt</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('gallery-container').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ff5555;">Error al cargar la biblioteca.</p>';
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                console.error('Error al copiar: ', err);
            });
        }

        let toastTimeout;
        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { 
                toast.classList.remove("show"); 
            }, 2500);
        }

        loadPrompts();
    </script>
</body>
</html>
