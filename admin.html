<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Automático - PaulOneShot</title>
    <style>
        :root {
            --bg-color: #121212; --surface-color: #1e1e1e;
            --accent-color: #ffe600; --text-color: #ffffff;
            --text-muted: #aaaaaa; --border-color: #333333;
        }
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100%; position: fixed; top: 0; left: 0; background-color: var(--bg-color); z-index: 1000;
        }
        .login-box {
            background-color: var(--surface-color); padding: 40px; border-radius: 16px;
            width: 100%; max-width: 380px; box-sizing: border-box; text-align: center; border: 1px solid var(--border-color);
        }
        .login-box img { width: 180px; margin-bottom: 20px; transition: width 0.3s ease; }
        #admin-panel { display: none; width: 100%; max-width: 600px; padding: 40px 20px; box-sizing: border-box; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        header img { transition: width 0.3s ease; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-muted); }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%; padding: 12px 16px; background-color: var(--surface-color);
            border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 1rem; box-sizing: border-box; outline: none;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent-color); }
        textarea { resize: vertical; height: 120px; }
        
        .btn-primary {
            background-color: var(--accent-color); color: #000; border: none;
            padding: 14px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%;
        }
        .btn-primary:hover { opacity: 0.9; }
        .instructions { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
        .error-msg { color: #ff5555; font-size: 0.85rem; margin-top: 10px; display: none; }
        .status-msg { margin-top: 15px; font-weight: 500; font-size: 0.95rem; text-align: center; }
        
        .settings-box {
            background: var(--surface-color); padding: 15px 20px; border-radius: 10px;
            border: 1px solid var(--border-color); margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <img id="login-logo" src="pauloneshot-solo-nombre.png" alt="Logo">
            <div class="form-group"><input type="password" id="admin-password" placeholder="Contraseña de acceso" onkeydown="if(event.key === 'Enter') checkPassword()"></div>
            <div class="form-group"><input type="password" id="github-token" placeholder="GitHub Token (PAT)" onkeydown="if(event.key === 'Enter') checkPassword()"></div>
            <button class="btn-primary" onclick="checkPassword()">Ingresar</button>
            <div id="login-error" class="error-msg">Datos incorrectos</div>
        </div>
    </div>

    <div id="admin-panel">
        <header>
            <img id="header-logo" src="pauloneshot-solo-nombre.png" alt="Logo">
            <button class="btn-primary" style="width: auto; padding: 8px 16px; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);" onclick="logout()">Salir</button>
        </header>

        <!-- Selector de tamaño del logo -->
        <div class="settings-box">
            <div class="form-group" style="margin-bottom: 0;">
                <label for="logo-size-select">Tamaño del Logo (En toda la web):</label>
                <select id="logo-size-select" onchange="changeLogoSize(this.value)">
                    <option value="1">1 - Pequeño (100px)</option>
                    <option value="2">2 - Pequeño Medio (140px)</option>
                    <option value="3" selected>3 - Medio (180px)</option>
                    <option value="4">4 - Medio Grande (230px)</option>
                    <option value="5">5 - Grande (300px)</option>
                </select>
            </div>
        </div>

        <div class="instructions">Sube tus nuevos prompts directamente. Al hacer clic en publicar, se actualizarán en tu web automáticamente en segundos.</div>

        <div class="form-group">
            <label>URL de la Imagen</label>
            <input type="text" id="img-url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>Texto del Prompt</label>
            <textarea id="prompt-text" placeholder="Escribe tu prompt..."></textarea>
        </div>

        <button class="btn-primary" id="pub-btn" onclick="publishPrompt()">Publicar Automáticamente</button>
        <div id="status" class="status-msg"></div>
    </div>

    <script>
        // CONFIGURACIÓN DE ACCESO A GITHUB
        const ADMIN_PASS = "paul2026"; 
        const GITHUB_USER = "pauloneshot"; // Tu usuario exacto de GitHub
        const GITHUB_REPO = "biblioteca-prompts"; // El nombre de tu repositorio

        // Tamaños asignados para cada nivel (1 al 5)
        const sizeMap = {
            "1": "100px",
            "2": "140px",
            "3": "180px",
            "4": "230px",
            "5": "300px"
        };

        function changeLogoSize(level) {
            const widthValue = sizeMap[level] || "180px";
            document.getElementById("header-logo").style.width = widthValue;
            document.getElementById("login-logo").style.width = widthValue;
            localStorage.setItem("logo_size_level", level);
        }

        function loadLogoSize() {
            const savedLevel = localStorage.getItem("logo_size_level") || "3";
            document.getElementById("logo-size-select").value = savedLevel;
            changeLogoSize(savedLevel);
        }

        function checkPassword() {
            const pass = document.getElementById("admin-password").value;
            const token = document.getElementById("github-token").value.trim();
            if (pass === ADMIN_PASS && token.length > 10) {
                sessionStorage.setItem("auth", "true");
                sessionStorage.setItem("gh_token", token);
                showPanel();
            } else {
                document.getElementById("login-error").style.display = "block";
            }
        }

        function showPanel() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("admin-panel").style.display = "block";
            loadLogoSize();
        }

        window.onload = function() {
            loadLogoSize();
            if (sessionStorage.getItem("auth") === "true") {
                showPanel();
            }
        }

        function logout() {
            sessionStorage.clear();
            location.reload();
        }

        async function publishPrompt() {
            const imgUrl = document.getElementById("img-url").value.trim();
            const promptText = document.getElementById("prompt-text").value.trim();
            const token = sessionStorage.getItem("gh_token");
            const statusEl = document.getElementById("status");
            const btn = document.getElementById("pub-btn");

            if (!imgUrl || !promptText) {
                alert("Completa todos los campos.");
                return;
            }

            btn.disabled = true;
            statusEl.style.color = "#ffe600";
            statusEl.textContent = "Conectando con GitHub y publicando...";

            const apiPath = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/prompts.json`;

            try {
                const getRes = await fetch(apiPath, {
                    headers: { "Authorization": `token ${token}` }
                });
                
                if (!getRes.ok) throw new Error("No se pudo conectar con GitHub. Revisa tu Token.");
                
                const fileData = await getRes.json();
                const sha = fileData.sha;
                const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

                currentContent.unshift({
                    image: imgUrl,
                    prompt: promptText
                });

                const newContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));

                const putRes = await fetch(apiPath, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Actualización automática de prompt desde admin",
                        content: newContentBase64,
                        sha: sha
                    })
                });

                if (!putRes.ok) throw new Error("Error al guardar en el repositorio.");

                statusEl.style.color = "#a6e22e";
                statusEl.textContent = "¡Publicado con éxito! Tu web se actualizará en unos segundos.";
                
                document.getElementById("img-url").value = "";
                document.getElementById("prompt-text").value = "";
                
                setTimeout(() => { statusEl.textContent = ""; btn.disabled = false; }, 4000);

            } catch (err) {
                console.error(err);
                statusEl.style.color = "#ff5555";
                statusEl.textContent = "Error: " + err.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
